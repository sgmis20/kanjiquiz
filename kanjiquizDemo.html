  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function generateQuiz() {
    var pageKey = document.getElementById('pageSelector').value;
    var numQ = parseInt(document.getElementById('numSelector').value);

    var pool = [];
    var label = '';

    if (pageKey === 'all') {
      var keys = Object.keys(quizData);
      for (var k = 0; k < keys.length; k++) {
        pool = pool.concat(quizData[keys[k]].words);
      }
      label = '전체 데이터 (랜덤)';
    } else {
      pool = quizData[pageKey].words.slice();
      label = quizData[pageKey].label;
    }

    shuffle(pool);

    if (numQ > pool.length) {
      numQ = pool.length;
    }

    var selected = pool.slice(0, numQ);

    document.getElementById('quizInfo').textContent = label;

    var tbody = document.getElementById('quizBody');
    tbody.innerHTML = '';

    for (var i = 0; i < selected.length; i += 5) {
      var tr = document.createElement('tr');
      for (var j = i; j < i + 5 && j < selected.length; j++) {
        var td = document.createElement('td');
        td.innerHTML =
          '<h4 class="problemNumber">Q' + (j + 1) + '</h4>' +
          '<h5 class="yomigana">' + selected[j].yomigana + '</h5>' +
          '<h5 class="tango">' + selected[j].tango + '</h5>' +
          '<h5 class="korMeaning">' + selected[j].kor + '</h5>';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    document.getElementById('formSection').style.display = 'none';
    document.getElementById('quizSection').style.display = 'block';

    hideAnswer();
  }

  function hideAnswer() {
    var upper = document.getElementsByClassName('yomigana');
    var middle = document.getElementsByClassName('tango');
    for (var i = 0; i < upper.length; i++) {
      upper[i].style.display = 'none';
      middle[i].style.display = 'none';
    }
  }

  function toggleAnswer() {
    var upper = document.getElementsByClassName('yomigana');
    var middle = document.getElementsByClassName('tango');
    for (var i = 0; i < upper.length; i++) {
      upper[i].style.display = (upper[i].style.display === 'none') ? 'block' : 'none';
    }
    for (var i = 0; i < middle.length; i++) {
      middle[i].style.display = (middle[i].style.display === 'none') ? 'block' : 'none';
    }
  }

  function resetQuiz() {
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('formSection').style.display = 'block';
  }

  document.getElementById('startQuiz').addEventListener('click', generateQuiz);
  document.getElementById('btnAnswer').addEventListener('click', toggleAnswer);
  document.getElementById('retryBtn').addEventListener('click', resetQuiz);
  </script>

</body>

</html>
