{% extends "base.html" %}

{% block content %}
<form action="/quiz/generate" method="POST">
  <section class="selectCard">
    <h3>퀴즈 데이터를 선택하세요</h3>
    <select id="pageSelector" name="selectedPage">
      <option value="all">전체 ({{ total }}단어, 랜덤)</option>
      {% for month in months %}
      <optgroup label="~·~·~ {{ month }}월 ~·~·~">
        {% for p in pages if p.month == month %}
        <option value="{{ p.key }}">{{ p.label }} ({{ p.pages }}페이지) [{{ p.word_count }}단어]</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
    <h3>문제 수를 선택하세요</h3>
    <select id="numSelector" name="howMany">
      {% for n in num_choices %}
      <option value="{{ n }}" {% if n == 10 %}selected{% endif %}>{{ n }} 개</option>
      {% endfor %}
    </select>
    <button type="submit" class="btnPrimary">퀴즈 시작</button>
  </section>
</form>
{% endblock %}
